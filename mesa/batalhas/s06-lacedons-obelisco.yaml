zonas:
  lacedon:
  - d: 1
    zona: Cabeça
    texto: O couro cabeludo descola como casca molhada; por baixo, osso verde.
  - d: 2
    zona: Pescoço
    texto: Abre-se sem sangue; sai água do pântano e um cheiro a peixe podre.
  - d: 3
    zona: Tronco
    texto: As costelas cedem como vime molhado; lá dentro mexem-se sanguessugas.
  - d: 4
    zona: Braço das garras
    texto: O braço dobra-se no sítio errado e continua a arranhar.
  - d: 5
    zona: Perna
    texto: A carne sai do osso aos farrapos; arrasta-se, mas não pára.
  - d: 6
    zona: Barriga
    texto: Rebenta como um odre; sai lodo negro, enguias pequenas e um dente que não é dele.
rondas:
- ronda: Antes
  texto: O Isco cheira água parada e, por baixo, carne morta. As rãs calam-se.
- ronda: '1'
  texto: Os lacedons 1 e 2 saem de debaixo da jangada. DES CD 10 para quem está em cima (o Alex falha sempre). A Lia escorrega das cordas. O Casqueiro larga a corda e vira-se.
- ronda: '2'
  texto: O Tibério e os lacedons 4 e 5 saem pelos flancos. A Nália grita «Esquerda!». O Elmiro congela com água à cintura. A Sousela dispara dos juncos. O Corvelo vê a farda e pára meio segundo.
- ronda: '3'
  texto: 'O lacedon 2 arrasta o Alex para a água, ou o Tibério arrasta o Elmiro paralisado: alguém escolhe quem tira. O Damião escreve, encostado ao escudo do Casqueiro.'
- ronda: '4'
  texto: Os que restam mergulham e vão-se, longe da pedra, todos para o mesmo lado (o da Bolbara).
rescaldo:
- As rãs voltam, graves, e depois afinam.
- 'O Corvelo vira o que resta do Tibério, em cima da jangada: «Tibério. Estava de guarda à capela.» Primeira pista de que o forte caiu. Não se jogou na S6: fica para o arranque da S7 (Decidido pelo DM (2026-10-18)).'
- Os paralisados acordam ao fim de 1 minuto e lembram-se de tudo.
- 'O Corvelo à Lia: «Vais tentar fugir?» Se hesitar, o Alex: «Ela salvou-me a vida, sargento. Duas vezes.»'
- O Elmiro não consegue olhar para ela.
- O Damião escreve tudo; se viu o Isco ou o Lucan, muda de alvo agora.
- 'Oração Curativa (Lia, 10 minutos): os soldados deixam de saber o que pensar dela.'
- Depois disto, a pedra.
checklist:
- 'Elfos imunes à paralisia: Lia e Nália'
- Lia com desvantagem ao sol; magias de save não
- Comando em goblin; Sugestão e Sono não
- 'Ronda 1: jangada e a Lia solta-se'
- 'Ronda 2: o Tibério'
- 'Paralisado arrastado: uma ronda para o salvar'
- Os que fogem vão todos para o lado da Bolbara
- O Corvelo, a Lia e o Alex no fim
