name: Cópia na Drive

# Mantém a cópia do repositório na Drive (DND/cotn_2026/copia_repo): o zip e um documento por área.
# Precisa do segredo GDRIVE_SA_KEY (chave JSON de uma conta de serviço com acesso de editor à pasta).
# Sem o segredo, o job termina sem fazer nada. Instruções em docs/copia-drive.md.

on:
  push:
    branches: [main]
    # Os «Guardar» da app (só grelha/dm.json) entram na cópia diária, para não correr a cada clique.
    paths-ignore:
      - 'grelha/dm.json'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copia-drive
  cancel-in-progress: true

jobs:
  copia:
    runs-on: ubuntu-latest
    env:
      GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
      GDRIVE_PASTA: 1z1HPx3iNHSlvnyDiJfEelVZcKxfQGr0R
    steps:
      - if: env.GDRIVE_SA_KEY == ''
        run: echo "Sem o segredo GDRIVE_SA_KEY; nada a fazer (docs/copia-drive.md)."
      - if: env.GDRIVE_SA_KEY != ''
        uses: actions/checkout@v4
      - if: env.GDRIVE_SA_KEY != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: env.GDRIVE_SA_KEY != ''
        run: pip install google-api-python-client google-auth
      - if: env.GDRIVE_SA_KEY != ''
        run: python3 scripts/copia-drive.py gerar copia
      - if: env.GDRIVE_SA_KEY != ''
        run: python3 scripts/copia-drive.py enviar copia
